<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Velthoria SMP</title>
</head>
<body>

<h2>Kayıt Ol</h2>
<input id="email" placeholder="E-posta">
<input id="password" type="password" placeholder="Şifre">
<input id="username" placeholder="Kullanıcı Adı">
<button onclick="register()">Kayıt Ol</button>

<h2>Giriş Yap</h2>
<input id="loginEmail" placeholder="E-posta">
<input id="loginPassword" type="password" placeholder="Şifre">
<button onclick="login()">Giriş</button>

<hr>

<div id="profile" style="display:none;">
  <h2>Profil</h2>
  <p id="userInfo"></p>

  <h3>Yetkili Başvurusu</h3>
  <textarea id="appForm" placeholder="Başvuru sorularını doldur"></textarea>
  <button onclick="sendApplication()">Başvur</button>

  <div id="adminPanel" style="display:none;">
    <h3>Yetkili Paneli</h3>
    <input id="tagUser" placeholder="Kullanıcı UID">
    <input id="tagText" placeholder="Verilecek Tag">
    <button onclick="giveTag()">Tag Ver</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  /* BURAYA FIREBASE CONFIG */
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.register = async () => {
  const email = email.value;
  const password = password.value;
  const username = username.value;

  const userCred = await createUserWithEmailAndPassword(auth, email, password);

  await setDoc(doc(db, "users", userCred.user.uid), {
    username,
    role: "user",
    tag: ""
  });

  alert("Kayıt başarılı");
};

window.login = async () => {
  const email = loginEmail.value;
  const password = loginPassword.value;

  const userCred = await signInWithEmailAndPassword(auth, email, password);
  const userDoc = await getDoc(doc(db, "users", userCred.user.uid));

  document.getElementById("profile").style.display = "block";
  userInfo.innerText = JSON.stringify(userDoc.data());

  if(userDoc.data().role === "admin"){
    adminPanel.style.display = "block";
  }
};

window.sendApplication = async () => {
  const text = appForm.value;
  const uid = auth.currentUser.uid;

  await setDoc(doc(db, "applications", uid), {
    text,
    status: "pending"
  });

  alert("Başvuru gönderildi");
};

window.giveTag = async () => {
  const uid = tagUser.value;
  const tag = tagText.value;

  await setDoc(doc(db, "users", uid), { tag }, { merge:true });
  alert("Tag verildi");
};
</script>

</body>
</html>
