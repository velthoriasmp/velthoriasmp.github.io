<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velthoria SMP</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:Poppins,sans-serif;background:#07070f;color:white}
nav{display:flex;justify-content:space-between;padding:20px 40px;background:#0d0d1a}
nav h1{color:#a970ff}
nav button{background:#6a5cff;border:none;color:white;padding:8px 16px;border-radius:6px;cursor:pointer}

.hero{text-align:center;padding:80px 20px;background:radial-gradient(circle,#1b1240,#050509)}
.hero h2{font-size:42px;margin-bottom:10px;color:#b983ff}

.section{padding:60px 20px;text-align:center}
.card{background:#101022;padding:25px;border-radius:12px;max-width:420px;margin:20px auto}
input,textarea{width:100%;padding:10px;margin:8px 0;border:none;border-radius:6px;background:#1a1a33;color:white}
button.submit{background:#7a5cff;border:none;padding:10px 20px;border-radius:6px;color:white;cursor:pointer}

#panel{display:none}
.tag{background:#6a5cff;padding:6px 12px;border-radius:6px;display:inline-block;margin-top:10px}
</style>
</head>

<body>

<nav>
<h1>VELTHORIA</h1>
<button onclick="openPanel()">Yetkili Paneli</button>
</nav>

<section class="hero">
<h2>Velthoria SMP</h2>
<p>IP: velthoria.falixsrv.me</p>
</section>

<!-- KAYIT -->
<section class="section">
<div class="card">
<h3>Kayıt Ol</h3>
<input id="username" placeholder="Kullanıcı adı">
<input id="email" placeholder="E-posta">
<button class="submit" onclick="register()">Kayıt Ol</button>
<p id="registerMsg"></p>
</div>
</section>

<!-- BAŞVURU -->
<section class="section">
<div class="card">
<h3>Yetkili Başvurusu</h3>
<input id="nick" placeholder="Minecraft Nick">
<textarea id="reason" placeholder="Neden yetkili olmak istiyorsun"></textarea>
<button class="submit" onclick="apply()">Başvur</button>
<p id="applyMsg"></p>
</div>
</section>

<!-- PANEL -->
<section id="panel" class="section">
<div class="card">
<h3>Yetkili Paneli</h3>
<input id="tagInput" placeholder="Tag yaz">
<button class="submit" onclick="addTag()">Tag Ekle</button>
<div id="tags"></div>
</div>
</section>

<script>
function register(){
document.getElementById("registerMsg").innerText="Kayıt başarılı ✔"
}

function apply(){
document.getElementById("applyMsg").innerText="Başvurun gönderildi ✔"
}

function openPanel(){
let pass=prompt("Yetkili şifresi gir")
if(pass==="velthoria123"){
document.getElementById("panel").style.display="block"
}else{
alert("Yanlış şifre")
}
}

function addTag(){
let tag=document.getElementById("tagInput").value
let div=document.createElement("div")
div.className="tag"
div.innerText=tag
document.getElementById("tags").appendChild(div)
}
</script>

</body>
</html>
