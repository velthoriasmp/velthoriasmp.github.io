<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velthoria SMP</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:Poppins,sans-serif;background:#07070f;color:white}
nav{display:flex;gap:20px;padding:20px;background:#0d0d1a}
nav a{cursor:pointer;color:#b983ff;text-decoration:none}

.page{display:none;padding:60px 20px;text-align:center}
.active{display:block}

.card{background:#101022;padding:25px;border-radius:12px;max-width:420px;margin:20px auto}
input,textarea{width:100%;padding:10px;margin:8px 0;border:none;border-radius:6px;background:#1a1a33;color:white}
button{background:#7a5cff;border:none;padding:10px 20px;border-radius:6px;color:white;cursor:pointer}
.tag{background:#6a5cff;padding:6px 12px;border-radius:6px;display:inline-block;margin:6px}
</style>
</head>

<body>

<nav>
<a onclick="show('home')">Ana Sayfa</a>
<a onclick="show('register')">Kayıt</a>
<a onclick="show('profile')">Profil</a>
<a onclick="show('apply')">Yetkili Başvuru</a>
<a onclick="openPanel()">Yetkili Panel</a>
</nav>

<!-- HOME -->
<div id="home" class="page active">
<h1>Velthoria SMP</h1>
<p>IP: velthoria.falixsrv.me</p>
</div>

<!-- REGISTER -->
<div id="register" class="page">
<div class="card">
<h3>Kayıt</h3>
<input id="regUser" placeholder="Kullanıcı adı">
<button onclick="register()">Kayıt Ol</button>
<p id="regMsg"></p>
</div>
</div>

<!-- PROFILE -->
<div id="profile" class="page">
<div class="card">
<h3>Profil</h3>
<p id="profileName">Kullanıcı yok</p>
<div id="profileTags"></div>
</div>
</div>

<!-- APPLY -->
<div id="apply" class="page">
<div class="card">
<h3>Yetkili Başvuru</h3>
<textarea id="applyText" placeholder="Başvurun"></textarea>
<button onclick="apply()">Gönder</button>
<p id="applyMsg"></p>
</div>
</div>

<!-- PANEL -->
<div id="panel" class="page">
<div class="card">
<h3>Yetkili Panel</h3>
<input id="tagUser" placeholder="Kullanıcı">
<input id="tagText" placeholder="Tag">
<button onclick="giveTag()">Tag Ver</button>
</div>
</div>

<script>
let currentUser=""
let tags={}

function show(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"))
document.getElementById(id).classList.add("active")
}

function register(){
currentUser=document.getElementById("regUser").value
document.getElementById("regMsg").innerText="Kayıt başarılı"
document.getElementById("profileName").innerText=currentUser
show("profile")
}

function apply(){
document.getElementById("applyMsg").innerText="Başvuru gönderildi"
}

function openPanel(){
let pass=prompt("Şifre")
if(pass==="velthoria123"){show("panel")}
else alert("Yanlış")
}

function giveTag(){
let user=document.getElementById("tagUser").value
let tag=document.getElementById("tagText").value

if(!tags[user]) tags[user]=[]
tags[user].push(tag)

if(user===currentUser){
renderTags()
}
}

function renderTags(){
let container=document.getElementById("profileTags")
container.innerHTML=""
if(tags[currentUser]){
tags[currentUser].forEach(t=>{
let div=document.createElement("div")
div.className="tag"
div.innerText=t
container.appendChild(div)
})
}
}
</script>

</body>
</html>
